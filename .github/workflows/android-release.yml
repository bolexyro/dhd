name: Android APK release

on:
  push:
    branches:
      - master
    tags:
      - "dhd-v*"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/dhd-v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # Only a merged PR's exact merge commit gets an automatic release.
            for attempt in 1 2 3 4; do
              pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                | jq -r --arg sha "$GITHUB_SHA" \
                  '[.[] | select(.merged_at != null and .base.ref == "master" and .merge_commit_sha == $sha) | .number] | first // empty')"
              if [[ -n "$pr_number" ]]; then break; fi
              if [[ "$attempt" -lt 4 ]]; then sleep 5; fi
            done
            if [[ -z "$pr_number" ]]; then
              echo "No merged PR at ${GITHUB_SHA}; skipping release."
              exit 0
            fi

            version="$(sed -nE '/^[[:space:]]*versionName[[:space:]]*=/{s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p;q;}' \
              apps/dhd-android/app/build.gradle.kts)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Expected a literal semantic versionName in apps/dhd-android/app/build.gradle.kts"
              exit 1
            fi

            tag="dhd-v${version}-pr${pr_number}"
            existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
            if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag ${tag} already points to another commit"
              exit 1
            fi
            if [[ -z "$existing" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" "$GITHUB_SHA" -m "DHD ${version} from PR #${pr_number}"
              git push origin "refs/tags/${tag}"
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.release.outputs.tag != ''
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/dhd-android/**/*.gradle*

      - name: Set up Android SDK
        if: steps.release.outputs.tag != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android build tools
        if: steps.release.outputs.tag != ''
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Test and build APK
        if: steps.release.outputs.tag != ''
        working-directory: apps/dhd-android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare release APK
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cp apps/dhd-android/app/build/outputs/apk/debug/app-debug.apk "DHD-${RELEASE_TAG}.apk"

      - name: Publish GitHub release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: DHD ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: DHD-${{ steps.release.outputs.tag }}.apk
